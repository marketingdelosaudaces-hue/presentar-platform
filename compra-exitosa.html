<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pago aprobado | PresentAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--violet:#8b66ff;--lime:#d4ff3d;--ink:#111;--muted:#68645e;--bg:#f5f3ee}
    *{box-sizing:border-box}
    body{margin:0;font:16px "DM Sans",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center}
    .card{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #ddd8cf;border-radius:32px;padding:clamp(28px,6vw,52px);box-shadow:0 24px 70px rgba(33,24,58,.08)}
    .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}.brand em{font-style:normal;color:var(--violet)}
    .mark{display:flex;gap:2px}.mark i{width:12px;height:15px;background:var(--violet);clip-path:polygon(0 0,58% 0,100% 50%,58% 100%,0 100%,42% 50%)}
    h1{font-size:clamp(38px,8vw,58px);line-height:.98;letter-spacing:-.055em;margin:28px 0 16px}
    p{color:var(--muted);line-height:1.65;margin:0;max-width:510px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    a,button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;text-decoration:none;font:800 14px "DM Sans",sans-serif;cursor:pointer}
    button{background:var(--lime);color:var(--ink)}
    button:disabled{opacity:.55;cursor:wait}
    .message{min-height:22px;margin-top:16px;font-size:13px;color:#9f2424}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span><span>Present<em>AR</em></span></div>
    <h1 id="title">Pago aprobado.</h1>
    <p id="copy">Recibimos tu compra. Te enviaremos por email los próximos pasos para configurar tu PresentAR.</p>
    <div class="actions">
      <button id="subscriptionButton" class="hidden" type="button">Activar abono Pro →</button>
      <a id="loginLink" href="/login.html">Ir a mi cuenta →</a>
    </div>
    <div class="message" id="message" role="alert" aria-live="polite"></div>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const plan=String(params.get('plan')||'').toLowerCase();
    const subscriptionReturn=params.get('subscription')==='1';
    const externalReference=params.get('external_reference')||params.get('order')||'';
    const paymentId=params.get('payment_id')||params.get('collection_id')||'';
    const payerEmail=params.get('payer_email')||'';
    const title=document.getElementById('title');
    const copy=document.getElementById('copy');
    const button=document.getElementById('subscriptionButton');
    const login=document.getElementById('loginLink');
    const message=document.getElementById('message');

    if(plan==='pro'&&!subscriptionReturn){
      title.textContent='Tu tarjeta Pro está aprobada.';
      copy.textContent='Falta un último paso: activar el abono mensual de $12.900 para habilitar contactos, estadísticas y seguimiento comercial.';
      button.classList.remove('hidden');
      login.classList.add('hidden');
    }
    if(plan==='pro'&&subscriptionReturn){
      title.textContent='Autorización recibida.';
      copy.textContent='Estamos confirmando el abono con Mercado Pago. Vas a recibir por email el acceso Pro y los próximos pasos cuando quede autorizado.';
    }

    button.addEventListener('click',async()=>{
      if(!externalReference){
        message.textContent='No pudimos identificar la compra. Contactanos para activar el abono sin realizar otro pago.';
        return;
      }
      button.disabled=true;
      button.textContent='Abriendo Mercado Pago…';
      message.textContent='';
      try{
        const response=await fetch('/api/crear-suscripcion',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({external_reference:externalReference,payment_id:paymentId,email:payerEmail})
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data.init_point)throw new Error(data.error||'No pudimos iniciar el abono.');
        location.href=data.init_point;
      }catch(error){
        message.textContent=error.message||'No pudimos iniciar el abono.';
        button.disabled=false;
        button.textContent='Activar abono Pro →';
      }
    });
  </script>
</body>
</html>

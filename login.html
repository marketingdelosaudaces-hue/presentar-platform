<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingresar | PresentAR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--violet:#5c3d9b;--ink:#111;--muted:#6b6b72;--line:#e7e7eb;--bg:#f6f6f8}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.06)}
    .brand{font-weight:900;font-size:24px;margin-bottom:30px}.brand span{color:var(--violet)} h1{font-size:40px;line-height:1;margin:0 0 12px}.lead{color:var(--muted);line-height:1.5;margin-bottom:26px}
    label{display:block;font-weight:700;margin-bottom:8px} input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none} input:focus{border-color:var(--violet)}
    button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.msg{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.45}.error{color:#b42318}.ok{color:#067647}
  </style>
</head>
<body>
<div class="wrap"><main class="card">
  <div class="brand">Present<span>AR</span></div>
  <h1>Tu PresentAR.</h1>
  <p class="lead">Ingresá con el mismo email que usaste en tu compra. Te enviaremos un enlace seguro, sin contraseña.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required placeholder="tu@email.com" />
    <button id="sendBtn" type="submit">Enviar enlace de acceso</button>
  </form>
  <div id="message" class="msg"></div>
</main></div>
<script>
const SUPABASE_URL='https://eldiuxxqqxjpwjtrxqfg.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZGl1eHhxcXhqcHdqdHJ4cWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODYwMjcsImV4cCI6MjA4OTE2MjAyN30.HX35eqm_x_Yz83gXEDZ9q8Bq9Qdwt1ZC2CgKh1NWLFA';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('loginForm'), msg=document.getElementById('message'), btn=document.getElementById('sendBtn');
(async()=>{ const {data}=await client.auth.getSession(); if(data.session) location.href='/editor.html'; })();
form.addEventListener('submit',async(e)=>{
 e.preventDefault(); btn.disabled=true; btn.textContent='Enviando...'; msg.textContent=''; msg.className='msg';
 const email=document.getElementById('email').value.trim().toLowerCase();
 const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:'https://presentarstudio.com/editor.html'}});
 if(error){msg.textContent='No pudimos enviar el enlace. Verificá que el email corresponda a una cuenta PresentAR activa.';msg.className='msg error';}
 else {msg.textContent='Listo. Revisá tu correo y abrí el enlace para entrar a tu PresentAR.';msg.className='msg ok';}
 btn.disabled=false; btn.textContent='Enviar enlace de acceso';
});
</script>
</body>
</html>
